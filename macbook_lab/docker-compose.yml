# MacBook lab docker-compose orchestration.
# One command brings up all platform stubs, the harness walker, the trace viewer,
# the Anthropic-backed chat service, and the React dashboard when enabled.
#
# Build context is the repo root (one directory up) so the Dockerfiles can COPY
# both 5G_O-RAN_SIM/ and harness/ paths.

services:

  ptp-operator-stub:
    build:
      context: ..
      dockerfile: macbook_lab/Dockerfile.platform-stub
      args:
        WRAPPER_SCRIPT: ptp_operator_service.py
        SERVICE_PORT: "8091"
    container_name: oran-ptp-operator-stub
    ports:
      - "8091:8091"
    environment:
      - PORT=8091
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3

  metal3-bmo-stub:
    build:
      context: ..
      dockerfile: macbook_lab/Dockerfile.platform-stub
      args:
        WRAPPER_SCRIPT: metal3_bmo_service.py
        SERVICE_PORT: "8092"
    container_name: oran-metal3-bmo-stub
    ports:
      - "8092:8092"
    environment:
      - PORT=8092
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3

  redfish-bmc-stub:
    build:
      context: ..
      dockerfile: macbook_lab/Dockerfile.platform-stub
      args:
        WRAPPER_SCRIPT: redfish_bmc_service.py
        SERVICE_PORT: "8093"
    container_name: oran-redfish-bmc-stub
    ports:
      - "8093:8093"
    environment:
      - PORT=8093
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3

  tmf921-smo-stub:
    build:
      context: ..
      dockerfile: macbook_lab/Dockerfile.platform-stub
      args:
        WRAPPER_SCRIPT: tmf921_smo_service.py
        SERVICE_PORT: "8094"
    container_name: oran-tmf921-smo-stub
    ports:
      - "8094:8094"
    environment:
      - PORT=8094
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8094/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3

  harness-chat:
    # oh-my-tiny-oran: a tiny OMC-shaped chat harness scoped to the oran-discover
    # skill bundle. POST /chat (multi-turn, session-keyed). Slash commands like
    # /oran-discover:ptp inline the skill markdown into the user message the same
    # way upstream OMC keyword-detector does. Anthropic agent loop with two
    # read-only tools (curl_endpoint, read_file).
    build:
      context: ..
      dockerfile: macbook_lab/Dockerfile.harness-chat
    container_name: oran-harness-chat
    ports:
      - "8098:8098"
    env_file:
      - anthropic.env
    environment:
      - PORT=8098
      - ANTHROPIC_MODEL_LOW=${ANTHROPIC_MODEL_LOW:-claude-haiku-4-5-20251001}
      - TINY_ORAN_MAX_TURNS=${TINY_ORAN_MAX_TURNS:-10}
      - TINY_ORAN_RESPONSE_MAX_TOKENS=${TINY_ORAN_RESPONSE_MAX_TOKENS:-900}
      - TINY_ORAN_FINAL_SYNTHESIS_TOKENS=${TINY_ORAN_FINAL_SYNTHESIS_TOKENS:-700}
    depends_on:
      - ptp-operator-stub
      - metal3-bmo-stub
      - redfish-bmc-stub
      - tmf921-smo-stub
      - harness-walker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8098/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3

  trace-viewer:
    build:
      context: ..
      dockerfile: macbook_lab/Dockerfile.trace-viewer
    container_name: oran-trace-viewer
    ports:
      - "8095:8095"
    restart: unless-stopped

  harness-walker:
    build:
      context: ..
      dockerfile: macbook_lab/Dockerfile.harness-walker
    container_name: oran-harness-walker
    ports:
      - "8096:8096"
    environment:
      - PORT=8096
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-stub-replace-with-real-key}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_MODEL_HIGH=${ANTHROPIC_MODEL_HIGH:-claude-opus-4-7}
      - ANTHROPIC_MODEL_MEDIUM=${ANTHROPIC_MODEL_MEDIUM:-claude-sonnet-4-6}
      - ANTHROPIC_MODEL_LOW=${ANTHROPIC_MODEL_LOW:-claude-haiku-4-5}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-stub-replace-with-real-key}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL_HIGH=${OPENAI_MODEL_HIGH:-gpt-4o}
      - OPENAI_MODEL_MEDIUM=${OPENAI_MODEL_MEDIUM:-gpt-4o-mini}
      - OPENAI_MODEL_LOW=${OPENAI_MODEL_LOW:-gpt-4o-mini}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_MODEL_HIGH=${VLLM_MODEL_HIGH:-granite-7b-instruct}
      - VLLM_MODEL_MEDIUM=${VLLM_MODEL_MEDIUM:-llama-3-8b-instruct}
      - VLLM_MODEL_LOW=${VLLM_MODEL_LOW:-mistral-7b-instruct}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ORAN_LLM_MODE=${ORAN_LLM_MODE:-heuristic}
    depends_on:
      - ptp-operator-stub
      - metal3-bmo-stub
      - redfish-bmc-stub
      - tmf921-smo-stub
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8096/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3

  dashboard:
    # React + Vite + shadcn dashboard at macbook_lab/dashboard/.
    # Gated behind --profile dashboard so the core lab can come up without it.
    # run.sh enables this profile automatically when dashboard/package.json is present.
    profiles:
      - dashboard
    build:
      context: ..
      dockerfile: macbook_lab/Dockerfile.dashboard
    container_name: oran-dashboard
    ports:
      - "8097:5173"
    depends_on:
      - harness-walker
      - ptp-operator-stub
      - metal3-bmo-stub
      - redfish-bmc-stub
      - tmf921-smo-stub
    restart: unless-stopped
