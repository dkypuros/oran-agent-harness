# Conforms to: kmm.sigs.x-k8s.io/v1beta1 Module
# Bibliography ref: 10, 42
# Scenario A-prime remediation
# Replace in-tree ice driver with a known-good OOT build (1.13.7) on RAN
# worker nodes via Kernel Module Management Operator (KMM).
#
# Delivered NOT via MachineConfig / Machine Config Operator but via KMM.
# This is the demonstration that the routing rule's "down to O-Cloud"
# branch resolves to different internal delivery mechanisms depending
# on the remediation payload type.
#
# KMM builds the OOT module against the running kernel, signs it,
# unloads the in-tree variant via inTreeRemoval, loads the new module,
# and restarts dependent services (PTP via the linuxptp-daemon).
---
apiVersion: kmm.sigs.x-k8s.io/v1beta1
kind: Module
metadata:
  name: ice-driver-update
  namespace: openshift-kmm
  labels:
    app.kubernetes.io/part-of: oran-agent-harness
spec:
  moduleLoader:
    container:
      modprobe:
        moduleName: ice
        parameters:
          - "debug=0"
      kernelMappings:
        - regexp: '^.+\.x86_64$'
          containerImage: "registry.example.com/oran/ice-driver:1.13.7-${KERNEL_FULL_VERSION}"
          inTreeRemoval:
            kernelModules:
              - ice
              - iavf
  selector:
    node-role.kubernetes.io/worker-ran: ""
    feature.node.kubernetes.io/network-sriov.capable: "true"
